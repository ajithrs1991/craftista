name: Build and Push Frontend App

on:
  push:
    branches:
      - dev/ajith

  workflow_dispatch:

jobs:

  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS:23.10
        uses: actions/setup-node@v4
        with:
          node-version: "23.10"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        env:
          GITHUB_SHA: ${{ github.sha }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_IMAGE_NAME: frontend
        run: |
          docker image build . --file frontend/Dockerfile --tag frontend:$GITHUB_SHA
          docker image tag frontend:$GITHUB_SHA $DOCKER_USERNAME/frontend:$GITHUB_SHA
          docker image push $DOCKER_USERNAME/frontend:$GITHUB_SHA
