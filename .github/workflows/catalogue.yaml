name: build and push catalogue app
on: 
  push:
    branches:
      - dev/ajith
  workflow_dispatch:
jobs: 
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Get short commit hash
        id: short_commit_hash
        run: |
          SHORT_TAG=$(git rev-parse --short HEAD)
          echo "::set-output name=short_tag::$SHORT_TAG"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        env:
          GITHUB_SHA: ${{ github.sha }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_IMAGE_NAME: catalogue
        run: |
          SHORT_TAG="${{ steps.short_commit_hash.outputs.short_tag }}"
          docker image build . --file catalogue/Dockerfile --tag $DOCKER_IMAGE_NAME:$SHORT_TAG
          docker image tag $DOCKER_IMAGE_NAME:$SHORT_TAG $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:$SHORT_TAG
          docker image push $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:$SHORT_TAG